<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tournament Admin Panel</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,Helvetica,sans-serif;
  background:#0b1020;
  color:#fff;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}

.login{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(circle at top,#202a55 0,#0b1020 45%);
}
.login-box{
  width:100%;
  max-width:420px;
  background:#11182d;
  border:1px solid #29345a;
  border-radius:22px;
  padding:30px;
  box-shadow:0 20px 70px #0008;
}
.logo{
  width:65px;height:65px;
  border-radius:18px;
  display:grid;place-items:center;
  margin:0 auto 18px;
  background:linear-gradient(135deg,#6c5ce7,#00cec9);
  font-size:30px;
}
.login h1{text-align:center;margin-bottom:8px}
.login p{text-align:center;color:#8994b5;margin-bottom:25px}
.input{
  width:100%;
  padding:13px 15px;
  border-radius:12px;
  border:1px solid #303b61;
  background:#0b1020;
  color:white;
  outline:none;
  margin-bottom:13px;
}
.btn{
  padding:12px 17px;
  border-radius:11px;
  background:#252e4e;
  color:white;
}
.btn-primary{
  background:linear-gradient(135deg,#6c5ce7,#00b894);
}
.btn-danger{background:#d63031}
.btn-success{background:#00b894}
.btn-warning{background:#e1a400;color:#111}
.btn-full{width:100%}
.error{color:#ff7675;text-align:center;margin-top:12px;display:none}

.app{display:none;min-height:100vh}
.sidebar{
  position:fixed;
  left:0;top:0;bottom:0;
  width:245px;
  background:#10172b;
  border-right:1px solid #252e4e;
  padding:22px 15px;
}
.brand{
  font-size:20px;font-weight:bold;
  padding:10px 12px 25px;
}
.brand span{color:#6c5ce7}
.nav button{
  width:100%;
  text-align:left;
  background:transparent;
  color:#aab4d0;
  padding:13px;
  margin:3px 0;
  border-radius:10px;
}
.nav button:hover,.nav button.active{
  background:#222b4a;
  color:white;
}
.logout{
  position:absolute;
  bottom:20px;left:15px;right:15px;
}

.main{
  margin-left:245px;
  padding:25px;
}
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:25px;
}
.topbar h2{font-size:26px}
.admin-badge{
  background:#19213c;
  padding:10px 14px;
  border-radius:20px;
  color:#b9c2dc;
}

.page{display:none}
.page.active{display:block}

.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:25px;
}
.card{
  background:#121a30;
  border:1px solid #273254;
  border-radius:17px;
  padding:20px;
}
.card small{color:#8994b5}
.card h3{font-size:27px;margin-top:10px}
.icon{font-size:24px}

.section{
  background:#121a30;
  border:1px solid #273254;
  border-radius:17px;
  padding:20px;
  margin-bottom:20px;
}
.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:17px;
}
.section-head h3{font-size:18px}

.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:700px}
th,td{
  padding:13px 10px;
  border-bottom:1px solid #252e4e;
  text-align:left;
  font-size:14px;
}
th{color:#8994b5}
.badge{
  display:inline-block;
  padding:6px 9px;
  border-radius:20px;
  font-size:12px;
  background:#252e4e;
}
.badge.green{background:#123d35;color:#55efc4}
.badge.yellow{background:#403615;color:#ffeaa7}
.badge.red{background:#421d25;color:#ff7675}

.actions{display:flex;gap:7px;flex-wrap:wrap}
.actions .btn{padding:7px 10px;font-size:12px}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#0009;
  z-index:10;
  align-items:center;
  justify-content:center;
  padding:15px;
}
.modal.show{display:flex}
.modal-box{
  width:100%;
  max-width:620px;
  max-height:92vh;
  overflow:auto;
  background:#121a30;
  border:1px solid #303b61;
  border-radius:20px;
  padding:22px;
}
.modal-head{
  display:flex;
  justify-content:space-between;
  margin-bottom:20px;
}
.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13px;
}
.form-group{margin-bottom:13px}
.form-group label{
  display:block;
  color:#9ca7c5;
  font-size:13px;
  margin-bottom:7px;
}
.form-group.full{grid-column:1/-1}
textarea.input{min-height:90px;resize:vertical}

.qr-preview{
  width:140px;height:140px;
  object-fit:contain;
  border:1px dashed #53618b;
  border-radius:12px;
  display:none;
  margin-top:10px;
  background:white;
}
.file{
  width:100%;
  padding:12px;
  border:1px dashed #53618b;
  border-radius:12px;
  color:#9ca7c5;
}
.empty{
  text-align:center;
  padding:30px;
  color:#8994b5;
}

.mobile-menu{display:none}

@media(max-width:900px){
  .sidebar{
    transform:translateX(-100%);
    z-index:20;
    transition:.25s;
  }
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0;padding:16px}
  .mobile-menu{
    display:block;
    background:#252e4e;
    color:#fff;
    padding:10px 13px;
    border-radius:10px;
  }
  .cards{grid-template-columns:1fr 1fr}
}
@media(max-width:560px){
  .cards{grid-template-columns:1fr 1fr}
  .card{padding:14px}
  .card h3{font-size:21px}
  .topbar h2{font-size:21px}
  .form-grid{grid-template-columns:1fr}
  .form-group.full{grid-column:auto}
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="login" id="loginScreen">
  <div class="login-box">
    <div class="logo">🏆</div>
    <h1>Admin Panel</h1>
    <p>Tournament Management System</p>

    <input id="username" class="input" placeholder="Admin username">
    <input id="password" class="input" type="password" placeholder="Password">

    <button class="btn btn-primary btn-full" onclick="login()">
      Login to Dashboard
    </button>

    <div class="error" id="loginError">Wrong username or password</div>
  </div>
</div>

<!-- APP -->
<div class="app" id="app">

  <aside class="sidebar" id="sidebar">
    <div class="brand">🏆 <span>Tournament</span> Admin</div>

    <div class="nav">
      <button class="active" onclick="showPage('dashboard',this)">📊 Dashboard</button>
      <button onclick="showPage('tournaments',this)">🏆 Tournaments</button>
      <button onclick="showPage('players',this)">👥 Players</button>
      <button onclick="showPage('payments',this)">💳 Payments</button>
    </div>

    <button class="btn btn-danger btn-full logout" onclick="logout()">Logout</button>
  </aside>

  <main class="main">

    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="mobile-menu" onclick="toggleMenu()">☰</button>
        <h2 id="pageTitle">Dashboard</h2>
      </div>
      <div class="admin-badge">👤 Admin</div>
    </div>

    <!-- DASHBOARD -->
    <section id="dashboard" class="page active">

      <div class="cards">
        <div class="card">
          <div class="icon">🏆</div>
          <small>Total Tournaments</small>
          <h3 id="totalTournaments">0</h3>
        </div>

        <div class="card">
          <div class="icon">👥</div>
          <small>Total Players</small>
          <h3 id="totalPlayers">0</h3>
        </div>

        <div class="card">
          <div class="icon">💰</div>
          <small>Total Revenue</small>
          <h3>₹<span id="totalRevenue">0</span></h3>
        </div>

        <div class="card">
          <div class="icon">⏳</div>
          <small>Pending Payments</small>
          <h3 id="pendingPayments">0</h3>
        </div>
      </div>

      <div class="section">
        <div class="section-head">
          <h3>Recent Tournaments</h3>
          <button class="btn btn-primary" onclick="openTournament()">+ Add Tournament</button>
        </div>
        <div id="recentTournaments"></div>
      </div>

    </section>

    <!-- TOURNAMENTS -->
    <section id="tournaments" class="page">
      <div class="section">
        <div class="section-head">
          <h3>All Tournaments</h3>
          <button class="btn btn-primary" onclick="openTournament()">+ Create Tournament</button>
        </div>
        <div id="tournamentList"></div>
      </div>
    </section>

    <!-- PLAYERS -->
    <section id="players" class="page">
      <div class="section">
        <div class="section-head">
          <h3>Registered Players</h3>
        </div>
        <div id="playerList"></div>
      </div>
    </section>

    <!-- PAYMENTS -->
    <section id="payments" class="page">
      <div class="section">
        <div class="section-head">
          <h3>Payment Management</h3>
        </div>
        <div id="paymentList"></div>
      </div>
    </section>

  </main>
</div>

<!-- TOURNAMENT MODAL -->
<div class="modal" id="tournamentModal">
  <div class="modal-box">

    <div class="modal-head">
      <h3 id="modalTitle">Create Tournament</h3>
      <button class="btn" onclick="closeTournament()">✕</button>
    </div>

    <input type="hidden" id="editId">

    <div class="form-grid">

      <div class="form-group full">
        <label>Tournament Name</label>
        <input id="tName" class="input" placeholder="e.g. BGMI Night Cup">
      </div>

      <div class="form-group">
        <label>Game</label>
        <select id="tGame" class="input">
          <option>BGMI</option>
          <option>Free Fire</option>
          <option>Free Fire MAX</option>
          <option>COD Mobile</option>
          <option>Other</option>
        </select>
      </div>

      <div class="form-group">
        <label>Entry Fee (₹)</label>
        <input id="tFee" class="input" type="number" placeholder="50">
      </div>

      <div class="form-group">
        <label>Prize Pool (₹)</label>
        <input id="tPrize" class="input" type="number" placeholder="5000">
      </div>

      <div class="form-group">
        <label>Slots</label>
        <input id="tSlots" class="input" type="number" placeholder="100">
      </div>

      <div class="form-group">
        <label>Date</label>
        <input id="tDate" class="input" type="date">
      </div>

      <div class="form-group">
        <label>Time</label>
        <input id="tTime" class="input" type="time">
      </div>

      <div class="form-group">
        <label>Status</label>
        <select id="tStatus" class="input">
          <option>Upcoming</option>
          <option>Live</option>
          <option>Completed</option>
        </select>
      </div>

      <div class="form-group full">
        <label>Rules</label>
        <textarea id="tRules" class="input"
          placeholder="Tournament rules..."></textarea>
      </div>

      <div class="form-group full">
        <label>Payment QR Code Image</label>
        <input id="qrFile" class="file" type="file" accept="image/*"
               onchange="previewQR(event)">
        <img id="qrPreview" class="qr-preview">
      </div>

    </div>

    <button class="btn btn-primary btn-full" onclick="saveTournament()">
      Save Tournament
    </button>

  </div>
</div>

<script>
/* =========================
   DEMO DATA
========================= */

let tournaments = JSON.parse(localStorage.getItem("tournaments") || "[]");
let players = JSON.parse(localStorage.getItem("players") || "[]");
let payments = JSON.parse(localStorage.getItem("payments") || "[]");

/* DEMO PLAYER DATA */
if(players.length === 0){
  players = [
    {
      id:1,
      name:"Rahul Gamer",
      phone:"9876543210",
      tournament:"Demo BGMI Cup",
      payment:"Approved"
    },
    {
      id:2,
      name:"Pro Hunter",
      phone:"9876500000",
      tournament:"Demo BGMI Cup",
      payment:"Pending"
    }
  ];
  saveData();
}

/* =========================
   LOGIN
========================= */

function login(){
  const u = document.getElementById("username").value.trim();
  const p = document.getElementById("password").value.trim();

  if(u === "admin" && p === "1234"){
    localStorage.setItem("adminLoggedIn","yes");
    document.getElementById("loginScreen").style.display="none";
    document.getElementById("app").style.display="block";
    renderAll();
  }else{
    document.getElementById("loginError").style.display="block";
  }
}

function logout(){
  localStorage.removeItem("adminLoggedIn");
  location.reload();
}

if(localStorage.getItem("adminLoggedIn")==="yes"){
  document.getElementById("loginScreen").style.display="none";
  document.getElementById("app").style.display="block";
}

/* =========================
   NAVIGATION
========================= */

function showPage(id,btn){
  document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
  document.getElementById(id).classList.add("active");

  document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));
  btn.classList.add("active");

  const titles={
    dashboard:"Dashboard",
    tournaments:"Tournaments",
    players:"Players",
    payments:"Payments"
  };

  document.getElementById("pageTitle").textContent=titles[id];
  document.getElementById("sidebar").classList.remove("open");
}

function toggleMenu(){
  document.getElementById("sidebar").classList.toggle("open");
}

/* =========================
   STORAGE
========================= */

function saveData(){
  localStorage.setItem("tournaments",JSON.stringify(tournaments));
  localStorage.setItem("players",JSON.stringify(players));
  localStorage.setItem("payments",JSON.stringify(payments));
}

/* =========================
   TOURNAMENT
========================= */

function openTournament(id=null){

  document.getElementById("tournamentModal").classList.add("show");

  document.getElementById("editId").value="";
  document.getElementById("modalTitle").textContent="Create Tournament";

  document.getElementById("tName").value="";
  document.getElementById("tFee").value="";
  document.getElementById("tPrize").value="";
  document.getElementById("tSlots").value="";
  document.getElementById("tDate").value="";
  document.getElementById("tTime").value="";
  document.getElementById("tRules").value="";
  document.getElementById("tStatus").value="Upcoming";

  document.getElementById("qrFile").value="";
  document.getElementById("qrPreview").style.display="none";

  if(id){
    const t=tournaments.find(x=>x.id==id);
    if(!t)return;

    document.getElementById("modalTitle").textContent="Edit Tournament";
    document.getElementById("editId").value=t.id;
    document.getElementById("tName").value=t.name;
    document.getElementById("tGame").value=t.game;
    document.getElementById("tFee").value=t.fee;
    document.getElementById("tPrize").value=t.prize;
    document.getElementById("tSlots").value=t.slots;
    document.getElementById("tDate").value=t.date;
    document.getElementById("tTime").value=t.time;
    document.getElementById("tStatus").value=t.status;
    document.getElementById("tRules").value=t.rules;

    if(t.qr){
      document.getElementById("qrPreview").src=t.qr;
      document.getElementById("qrPreview").style.display="block";
    }
  }
}

function closeTournament(){
  document.getElementById("tournamentModal").classList.remove("show");
}

function previewQR(e){
  const file=e.target.files[0];
  if(!file)return;

  const reader=new FileReader();

  reader.onload=function(){
    document.getElementById("qrPreview").src=reader.result;
    document.getElementById("qrPreview").style.display="block";
  };

  reader.readAsDataURL(file);
}

function saveTournament(){

  const name=document.getElementById("tName").value.trim();

  if(!name){
    alert("Tournament name required");
    return;
  }

  const editId=document.getElementById("editId").value;

  let qr=document.getElementById("qrPreview").src || "";

  const data={
    id: editId ? Number(editId) : Date.now(),
    name:name,
    game:document.getElementById("tGame").value,
    fee:Number(document.getElementById("tFee").value||0),
    prize:Number(document.getElementById("tPrize").value||0),
    slots:Number(document.getElementById("tSlots").value||0),
    date:document.getElementById("tDate").value,
    time:document.getElementById("tTime").value,
    status:document.getElementById("tStatus").value,
    rules:document.getElementById("tRules").value,
    qr:qr
  };

  if(editId){
    const index=tournaments.findIndex(x=>x.id==editId);
    tournaments[index]=data;
  }else{
    tournaments.push(data);
  }

  saveData();
  closeTournament();
  renderAll();

  alert(editId ? "Tournament updated!" : "Tournament created!");
}

function deleteTournament(id){

  if(!confirm("Delete this tournament?"))return;

  tournaments=tournaments.filter(x=>x.id!==id);
  saveData();
  renderAll();
}

/* =========================
   RENDER
========================= */

function renderAll(){
  renderDashboard();
  renderTournaments();
  renderPlayers();
  renderPayments();
}

function renderDashboard(){

  document.getElementById("totalTournaments").textContent=tournaments.length;
  document.getElementById("totalPlayers").textContent=players.length;

  const revenue=payments
    .filter(x=>x.status==="Approved")
    .reduce((sum,x)=>sum+Number(x.amount||0),0);

  document.getElementById("totalRevenue").textContent=revenue;

  document.getElementById("pendingPayments").textContent=
    payments.filter(x=>x.status==="Pending").length;

  if(tournaments.length===0){
    document.getElementById("recentTournaments").innerHTML=
      '<div class="empty">No tournaments yet. Create your first tournament.</div>';
    return;
  }

  document.getElementById("recentTournaments").innerHTML=`
    <div class="table-wrap">
    <table>
      <tr>
        <th>Tournament</th>
        <th>Game</th>
        <th>Entry</th>
        <th>Prize</th>
        <th>Status</th>
      </tr>
      ${tournaments.slice(-5).reverse().map(t=>`
      <tr>
        <td>${escapeHTML(t.name)}</td>
        <td>${escapeHTML(t.game)}</td>
        <td>₹${t.fee}</td>
        <td>₹${t.prize}</td>
        <td>${statusBadge(t.status)}</td>
      </tr>`).join("")}
    </table>
    </div>
  `;
}

function renderTournaments(){

  if(tournaments.length===0){
    document.getElementById("tournamentList").innerHTML=
      '<div class="empty">No tournaments found.</div>';
    return;
  }

  document.getElementById("tournamentList").innerHTML=`
  <div class="table-wrap">
  <table>
    <tr>
      <th>Name</th>
      <th>Game</th>
      <th>Date</th>
      <th>Entry</th>
      <th>Prize</th>
      <th>Status</th>
      <th>Action</th>
    </tr>

    ${tournaments.map(t=>`
    <tr>
      <td>${escapeHTML(t.name)}</td>
      <td>${escapeHTML(t.game)}</td>
      <td>${t.date||"-"} ${t.time||""}</td>
      <td>₹${t.fee}</td>
      <td>₹${t.prize}</td>
      <td>${statusBadge(t.status)}</td>
      <td>
        <div class="actions">
          <button class="btn btn-warning" onclick="openTournament(${t.id})">Edit</button>
          <button class="btn btn-danger" onclick="deleteTournament(${t.id})">Delete</button>
        </div>
      </td>
    </tr>
    `).join("")}
  </table>
  </div>`;
}

function renderPlayers(){

  if(players.length===0){
    document.getElementById("playerList").innerHTML=
      '<div class="empty">No players registered.</div>';
    return;
  }

  document.getElementById("playerList").innerHTML=`
  <div class="table-wrap">
  <table>
    <tr>
      <th>Player</th>
      <th>Phone</th>
      <th>Tournament</th>
      <th>Payment</th>
    </tr>
    ${players.map(p=>`
    <tr>
      <td>${escapeHTML(p.name)}</td>
      <td>${escapeHTML(p.phone)}</td>
      <td>${escapeHTML(p.tournament)}</td>
      <td>${statusBadge(p.payment)}</td>
    </tr>
    `).join("")}
  </table>
  </div>`;
}

function renderPayments(){

  if(payments.length===0){
    document.getElementById("paymentList").innerHTML=`
      <div class="empty">
        No payments yet.<br>
        Real payment records will appear here after Firebase connection.
      </div>`;
    return;
  }

  document.getElementById("paymentList").innerHTML=`
  <div class="table-wrap">
  <table>
    <tr>
      <th>Player</th>
      <th>Tournament</th>
      <th>Amount</th>
      <th>Status</th>
      <th>Action</th>
    <
